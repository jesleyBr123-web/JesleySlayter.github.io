<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<title>Jesley Slayter Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#05040d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: coluna única pensada para iPhone (máx. 560px), cabeçalho de vidro fixo, barra flutuante no rodapé, fundo aurora + canvas de constelações. */
:root{
  color-scheme: dark;
  --bg:#05040d; --fg:#f4f1ff; --mut:#b3acd6; --dim:#7d779e;
  --glass:rgba(20,16,42,.58); --glass2:rgba(32,26,64,.62); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --g1:#7c3aed; --g2:#c026d3; --g3:#22d3ee;
  --grad:linear-gradient(120deg,var(--g1),var(--g2) 55%,var(--g3));
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --wa:#25d366;
  --r:22px; --r-s:14px;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--font);margin:0;min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:rgba(8,6,20,.82)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--g3);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ── Fundo ───────────────────────── */
#aurora{position:fixed;inset:-20%;z-index:-3;pointer-events:none;filter:blur(60px) saturate(130%);opacity:.75}
#aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 26s ease-in-out infinite alternate}
#aurora i:nth-child(1){width:60vmax;height:42vmax;left:-5%;top:0;background:radial-gradient(closest-side,rgba(124,58,237,.55),transparent)}
#aurora i:nth-child(2){width:50vmax;height:38vmax;right:-8%;top:18%;background:radial-gradient(closest-side,rgba(192,38,211,.42),transparent);animation-duration:32s;animation-delay:-8s}
#aurora i:nth-child(3){width:55vmax;height:36vmax;left:15%;bottom:-6%;background:radial-gradient(closest-side,rgba(34,211,238,.30),transparent);animation-duration:38s;animation-delay:-14s}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1) rotate(0)}50%{transform:translate3d(6vw,4vh,0) scale(1.12) rotate(12deg)}100%{transform:translate3d(-5vw,-3vh,0) scale(.95) rotate(-8deg)}}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}

/* ── Cabeçalho ───────────────────── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(8,6,20,.62);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line)}
.top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px;box-shadow:0 6px 22px -6px rgba(192,38,211,.7);flex:none;border:0;color:#fff}
.brand{min-width:0;flex:1}
.brand b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:10.5px;color:var(--mut);letter-spacing:.4px;text-transform:uppercase;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.04);display:grid;place-items:center;flex:none;font-size:17px;color:var(--fg)}
.icon-btn[aria-pressed="true"]{background:rgba(124,58,237,.22);border-color:rgba(124,58,237,.6)}
.sync{min-width:40px;height:40px;padding:0 10px;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:15px;flex:none}
.sync.ok{color:var(--ok)} .sync.warn{color:var(--warn);border-color:rgba(251,191,36,.45)} .sync.busy{color:var(--mut)}
.sync.busy span{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ── Estrutura ───────────────────── */
main{max-width:600px;margin:0 auto;padding-top:16px;padding-bottom:calc(var(--nav-h) + 44px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hello{padding:4px 2px 2px}
.hello .date{font-size:12.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:700}
.hello h1{margin:2px 0 0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.8px;text-wrap:balance}
.hello h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:var(--mut);margin:8px 2px 0;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px}
p{margin:0}
.muted{color:var(--mut)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11.5px}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}

/* ── Cartões de vidro ────────────── */
.card{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:var(--r);padding:16px;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(124,58,237,.75),rgba(192,38,211,.25) 45%,rgba(34,211,238,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:-1}
.card.flat{background:rgba(255,255,255,.03);-webkit-backdrop-filter:none;backdrop-filter:none}
.card.flat::before{background:var(--line2)}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}

/* ── Indicadores ─────────────────── */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:14px}
.kpi .lab{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.3px}
.kpi .val{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-top:4px}
.kpi .val.money{font-size:22px;letter-spacing:-.5px}
.kpi.good .val{color:var(--ok)} .kpi.bad .val{color:var(--bad)} .kpi.warn .val{color:var(--warn)}
.kpi .sub{font-size:11.5px;color:var(--dim);margin-top:2px}

/* ── Botões ──────────────────────── */
.btn{min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg);text-align:center;line-height:1.2;position:relative;overflow:hidden}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 26px -12px rgba(192,38,211,.85)}
.btn.p::after{content:"";position:absolute;top:0;bottom:0;width:45%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);transform:skewX(-18deg);animation:shine 5.5s ease-in-out infinite}
@keyframes shine{0%,72%{left:-60%}100%{left:130%}}
.btn.wa{background:rgba(37,211,102,.14);border-color:rgba(37,211,102,.45);color:#6ef0a0}
.btn.danger{color:var(--bad);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.07)}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:12px}
.btn.xs{min-height:34px;padding:0 10px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.04);display:grid;place-items:center;font-size:15px;flex:none;color:var(--fg)}
.ibtn.on{background:rgba(34,211,238,.16);border-color:rgba(34,211,238,.6)}
.ibtn[disabled]{opacity:.3;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--g3);font-weight:700;font-size:13.5px}

/* ── Campos ──────────────────────── */
label.f{display:flex;flex-direction:column;gap:5px;min-width:0}
label.f>span{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.3px}
.in,select.in,textarea.in{width:100%;min-height:46px;border-radius:13px;border:1px solid var(--line2);background:rgba(5,4,16,.55);padding:10px 12px;font-size:16px;font-weight:600;outline:none;-webkit-appearance:none;appearance:none}
textarea.in{min-height:84px;resize:vertical;line-height:1.4;font-weight:500}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.in:focus{border-color:rgba(34,211,238,.7);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.in::placeholder{color:#5f5a80;font-weight:500}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .full{grid-column:1/-1}
.fields3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fields4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.search{position:relative}
.search .in{padding-left:40px}
.search::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);font-size:20px;color:var(--mut);pointer-events:none}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:13.5px;font-weight:700;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.chip b{font-weight:800}
.yn{display:flex;gap:6px}
.yn button{min-width:58px;min-height:38px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-weight:700;font-size:14px;color:var(--mut)}
.yn button.on.s{background:rgba(248,113,113,.18);border-color:rgba(248,113,113,.6);color:#ffb4b4}
.yn button.on.n{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.55);color:#9af0cc}

/* ── Etiquetas ───────────────────── */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.2px;background:rgba(255,255,255,.07);color:var(--mut);white-space:nowrap}
.tag.ok{background:rgba(52,211,153,.14);color:#7ee8bf}
.tag.bad{background:rgba(248,113,113,.15);color:#ffa5a5}
.tag.warn{background:rgba(251,191,36,.14);color:#fcd56b}
.tag.cy{background:rgba(34,211,238,.14);color:#8eeaf8}
.tag.pu{background:rgba(124,58,237,.22);color:#cdb6ff}
.tag.mg{background:rgba(192,38,211,.2);color:#f0a6fb}

/* ── Alunos ──────────────────────── */
.av{width:46px;height:46px;border-radius:15px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;flex:none;letter-spacing:.3px}
.av.lg{width:62px;height:62px;border-radius:20px;font-size:22px}
.av.sm{width:36px;height:36px;border-radius:12px;font-size:13px}
.st-card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;color:var(--fg)}
.st-card .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--grad);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.list{display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;padding:26px 16px;color:var(--mut)}
.empty .big{font-size:38px;margin-bottom:6px}

/* ── Fila / tarefas ──────────────── */
.q-item{display:flex;flex-direction:column;gap:10px}
.q-top{display:flex;gap:10px;align-items:flex-start}
.q-msg{font-size:13.5px;color:var(--mut);background:rgba(255,255,255,.035);border-radius:12px;padding:10px 12px;white-space:pre-wrap;border:1px solid var(--line)}
.prio{width:8px;align-self:stretch;border-radius:8px;flex:none}
.prio.p1{background:var(--bad)} .prio.p2{background:var(--warn)} .prio.p3{background:var(--g2)} .prio.p4{background:var(--g3)} .prio.p5{background:var(--dim)}
.task{display:flex;gap:10px;align-items:center}
.check{width:30px;height:30px;border-radius:10px;border:2px solid var(--line2);background:none;flex:none;display:grid;place-items:center;font-weight:800;color:#fff}
.check.on{background:var(--grad);border-color:transparent}
.task.done .grow{text-decoration:line-through;opacity:.5}

/* ── Tela do aluno ───────────────── */
.st-head{display:flex;gap:14px;align-items:center}
.st-head h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.15;word-break:break-word}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--mut);font-weight:700;padding:4px 0;font-size:14px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:8px max(16px,env(safe-area-inset-left,0px));background:rgba(8,6,20,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:7px 8px;border-radius:14px;border:1px solid transparent;background:none;color:var(--mut);font-weight:700;font-size:11.5px}
.tab .ic{font-size:18px;line-height:1}
.tab.on{background:var(--grad);color:#fff;box-shadow:0 8px 20px -10px rgba(192,38,211,.9)}
.wa-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.wa-strip::-webkit-scrollbar{display:none}
.wa-chip{flex:none;min-height:38px;padding:0 13px;border-radius:999px;border:1px solid rgba(37,211,102,.35);background:rgba(37,211,102,.08);color:#8af2b4;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}

/* Anel */
.ring-wrap{display:flex;gap:16px;align-items:center}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rv b{font-size:26px;font-weight:800;letter-spacing:-.8px;display:block;line-height:1}
.ring .rv small{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.ring circle.pr{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;flex:1;min-width:0}
.stat .l{font-size:11.5px;color:var(--mut);font-weight:700}
.stat .v{font-size:20px;font-weight:800;letter-spacing:-.4px}

/* Grupos de formulário */
details.grp{border-radius:16px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
details.grp>summary{list-style:none;padding:13px 14px;font-weight:800;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"▾";color:var(--mut);transition:transform .2s}
details.grp[open]>summary::after{transform:rotate(180deg)}
details.grp>.gbody{padding:0 14px 14px}

/* Treinos */
.ex{border-radius:16px;background:rgba(5,4,16,.45);border:1px solid var(--line2);padding:12px;display:flex;flex-direction:column;gap:9px}
.ex.linked{border-color:rgba(34,211,238,.55)}
.ex-no{min-width:38px;height:30px;padding:0 8px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;color:#fff}
.ex-acts{display:flex;gap:6px;flex-wrap:wrap}
.chain{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#8eeaf8;padding:0 6px}
.chain::before,.chain::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.7),transparent)}
.grp-label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--g3);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.mini{font-size:12px;color:var(--dim)}
.ex .fields4 .in{padding:8px;text-align:center;font-size:16px}
.ex .fields4 label.f>span{text-align:center;font-size:11px}

/* Dieta */
.food{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.emo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:22px;flex:none}
.step{display:flex;align-items:center;gap:4px}
.step button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-weight:800;font-size:16px}
.step input{width:52px;min-height:34px;text-align:center;padding:4px;border-radius:10px}
.macro-bar{display:flex;height:10px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.07)}
.macro-bar i{display:block;height:100%;transition:width .5s}
.mb-p{background:var(--g3)} .mb-c{background:var(--g1)} .mb-g{background:var(--g2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.totals{position:sticky;top:calc(env(safe-area-inset-top,0px) + 136px);z-index:5}
.lib-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 6px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg)}

/* Gráficos */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .area{opacity:0;animation:fadein 1s .6s forwards}
@keyframes fadein{to{opacity:1}}
.chart .colb{transform-box:fill-box;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.tip{position:absolute;pointer-events:none;background:rgba(10,8,26,.94);border:1px solid var(--line2);padding:6px 10px;border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.improve li,.attn li{margin:4px 0}
ul.clean{margin:0;padding-left:18px}
.ai-out{white-space:pre-wrap;font-size:14.5px;line-height:1.55}
.ai-out ul{margin:6px 0;padding-left:18px;white-space:normal}
.ai-out p{margin:0 0 6px}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left}

/* ═════════ Cópia local (IndexedDB, com localStorage de reserva) ═════════ */
const LDB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('jsc-coach', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
        r.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  get(k) {
    return new Promise(res => {
      if (!this.db) { try { const v = localStorage.getItem('jsc.' + k); return res(v ? JSON.parse(v) : undefined); } catch (e) { return res(undefined); } }
      try { const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(undefined); }
    });
  },
  set(k, v) {
    return new Promise(res => {
      if (!this.db) { try { localStorage.setItem('jsc.' + k, JSON.stringify(v)); } catch (e) {} return res(); }
      try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); }
    });
  }
};

/* ═════════ Sincronização ═════════ */
const SY = {
  cloud: null, cloudState: 'none',   // none | connecting | ok | error
  pending: {alunos: {}, fotos: {}, config: 0},
  gen: 0, pushing: false, again: false, timer: null, fotosDirty: false, firstSnap: {alunos: false, fotos: false, config: false}
};
function markAluno(id) { const a = S.alunos[id]; if (a) a.updatedAt = Date.now(); SY.pending.alunos[id] = {op: a ? 'set' : 'del', gen: ++SY.gen}; schedule(); }
function markAlunoDel(id) { SY.pending.alunos[id] = {op: 'del', gen: ++SY.gen}; schedule(); }
function markFoto(id) { SY.pending.fotos[id] = {op: S.fotos[id] ? 'set' : 'del', gen: ++SY.gen}; SY.fotosDirty = true; schedule(); }
function markConfig() { S.config.updatedAt = Date.now(); SY.pending.config = ++SY.gen; schedule(); }
function schedule() { setSync('busy'); clearTimeout(SY.timer); SY.timer = setTimeout(flush, 700); }
async function flush() {
  clearTimeout(SY.timer); SY.timer = null;
  await persistLocal();
  await pushCloud();
  updSync();
}
async function persistLocal() {
  await LDB.set('alunos', S.alunos);
  await LDB.set('config', S.config);
  await LDB.set('pending', SY.pending);
  if (SY.fotosDirty) { SY.fotosDirty = false; await LDB.set('fotos', S.fotos); }
}
const hasPending = () => Object.keys(SY.pending.alunos).length || Object.keys(SY.pending.fotos).length || SY.pending.config;
async function pushCloud() {
  if (!SY.cloud || SY.cloudState === 'error') return;
  if (SY.pushing) { SY.again = true; return; }
  SY.pushing = true;
  let failed = false;
  try {
    for (const [coll, map] of [['alunos', SY.pending.alunos], ['fotos', SY.pending.fotos]]) {
      for (const id of Object.keys(map)) {
        const p = map[id];
        const src = coll === 'alunos' ? S.alunos[id] : S.fotos[id];
        try {
          if (p.op === 'del' || !src) await SY.cloud.collection(coll).doc(id).delete();
          else await SY.cloud.collection(coll).doc(id).set(clone(src));
          if (map[id] && map[id].gen === p.gen) delete map[id];
        } catch (e) {
          failed = true;
          if (e && (e.code === 'quota_exceeded')) toast('A nuvem está cheia. Exclua fotos antigas para liberar espaço.');
          if (e && (e.code === 'invalid_argument')) { toast('Não foi possível salvar um registro na nuvem (tamanho ou formato).'); delete map[id]; }
          if (e && (e.code === 'revoked' || e.code === 'not_granted')) { SY.cloudState = 'error'; break; }
        }
      }
    }
    if (SY.pending.config && SY.cloudState !== 'error') {
      const g = SY.pending.config;
      try { await SY.cloud.doc('config/coach').set(clone(S.config)); if (SY.pending.config === g) SY.pending.config = 0; }
      catch (e) { failed = true; }
    }
  } finally {
    SY.pushing = false;
    await LDB.set('pending', SY.pending);
  }
  if (SY.again) { SY.again = false; return pushCloud(); }
  if (failed) setTimeout(() => pushCloud().then(updSync), 15000);
}
function setSync(st) {
  const el = $('#sync'); if (!el) return;
  el.className = 'sync ' + st;
  el.innerHTML = st === 'ok' ? '✓' : st === 'warn' ? '⚠' : '<span>●</span>';
}
function syncText() {
  if (hasPending()) return SY.cloud ? 'Há alterações guardadas no aparelho. Elas vão para a nuvem assim que a conexão voltar.' : 'Alterações guardadas no aparelho.';
  if (SY.cloud && SY.cloudState === 'ok') return 'Tudo salvo na nuvem do aplicativo, com cópia no aparelho.';
  if (SY.cloud && SY.cloudState === 'connecting') return 'Conectando à nuvem. Seus dados estão salvos no aparelho.';
  if (SY.cloudState === 'error') return 'A nuvem não respondeu. Seus dados estão salvos no aparelho.';
  return 'Salvo no aparelho. Abra o app pelo link do Claude para salvar também na nuvem.';
}
function updSync() {
  if (SY.timer) return setSync('busy');
  if (hasPending() && SY.cloud) return setSync('warn');
  if (SY.cloud && SY.cloudState !== 'ok') return setSync(SY.cloudState === 'error' ? 'warn' : 'busy');
  setSync('ok');
}
window.addEventListener('online', () => pushCloud().then(updSync));
window.addEventListener('offline', updSync);
setInterval(() => { if (hasPending() && SY.cloud && !SY.pushing) pushCloud().then(updSync); }, 20000);

function applyRemote(coll, snap) {
  const map = coll === 'alunos' ? S.alunos : S.fotos;
  const pend = SY.pending[coll];
  let changed = false;
  for (const ch of snap.docChanges()) {
    const id = ch.doc.id;
    if (pend[id]) continue;
    if (ch.type === 'removed') { if (map[id]) { delete map[id]; changed = true; } continue; }
    const data = ch.doc.data(); if (!data) continue;
    const loc = map[id];
    if (!loc || (data.updatedAt || 0) > (loc.updatedAt || 0)) { map[id] = clone(data); changed = true; }
  }
  if (!snap.metadata.fromCache && !SY.firstSnap[coll]) {
    SY.firstSnap[coll] = true;
    const remote = new Set(snap.docs.map(d => d.id));
    Object.keys(map).forEach(id => { if (!remote.has(id) && !pend[id]) pend[id] = {op: 'set', gen: ++SY.gen}; });
    if (Object.keys(pend).length) schedule();
  }
  if (coll === 'fotos') SY.fotosDirty = true;
  if (changed) { persistLocal(); softRender(); }
}
async function connectCloud() {
  const db = await cap('db');
  if (!db) { SY.cloudState = 'none'; updSync(); return; }
  SY.cloud = db; SY.cloudState = 'connecting'; updSync();
  const loadTimer = setTimeout(() => { if (SY.cloudState === 'connecting') { setSync('warn'); } }, 10000);
  const okNow = () => { clearTimeout(loadTimer); if (SY.cloudState === 'connecting') SY.cloudState = 'ok'; updSync(); };
  const onErr = e => { clearTimeout(loadTimer); if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled')) SY.cloudState = 'error'; updSync(); };
  try {
    db.collection('alunos').onSnapshot(snap => { applyRemote('alunos', snap); if (!snap.metadata.fromCache) okNow(); }, onErr);
    db.collection('fotos').onSnapshot(snap => applyRemote('fotos', snap), onErr);
    db.doc('config/coach').onSnapshot(snap => {
      if (!snap.exists) { if (!snap.metadata.fromCache && !SY.firstSnap.config) { SY.firstSnap.config = true; markConfig(); } return; }
      SY.firstSnap.config = true;
      const d = snap.data();
      if (!SY.pending.config && (d.updatedAt || 0) > (S.config.updatedAt || 0)) { S.config = Object.assign(defaultConfig(), clone(d)); persistLocal(); softRender(); }
    }, onErr);
  } catch (e) { onErr(e); }
  if (hasPending()) pushCloud().then(updSync);
}
async function loadLocal() {
  await LDB.open();
  const [al, fo, cf, pe] = await Promise.all([LDB.get('alunos'), LDB.get('fotos'), LDB.get('config'), LDB.get('pending')]);
  if (al && typeof al === 'object') S.alunos = al;
  if (fo && typeof fo === 'object') S.fotos = fo;
  if (cf && typeof cf === 'object') S.config = Object.assign(defaultConfig(), cf);
  if (pe && typeof pe === 'object') SY.pending = Object.assign({alunos: {}, fotos: {}, config: 0}, pe);
  Object.values(S.alunos).forEach(fixAluno);
}

/* ═════════ Avisos, desfazer e painéis ═════════ */
let toastT;
function toast(msg, opts) {
  opts = opts || {};
  const root = $('#toastRoot');
  clearTimeout(toastT);
  const dur = opts.undo ? 6000 : (opts.ms || 2600);
  root.innerHTML = '<div class="toast" role="status"><span>' + esc(msg) + '</span>' + (opts.undo ? '<button class="btn sm p" id="undoBtn">Desfazer</button><i class="bar2" style="animation-duration:' + dur + 'ms"></i>' : '') + '</div>';
  if (opts.undo) $('#undoBtn').onclick = () => { root.innerHTML = ''; clearTimeout(toastT); opts.undo(); };
  toastT = setTimeout(() => { root.innerHTML = ''; if (opts.done) opts.done(); }, dur);
}
/* Remove algo e oferece Desfazer por 6 segundos */
function withUndo(label, removeFn, restoreFn) {
  removeFn();

}
let sheetOnClose = null;

/* ═════════ Arquivos (PDF, JSON) ═════════ */
async function saveFile(filename, blob) {
  const dl = await cap('downloads');
  if (dl) {
    try { await dl.save({filename, data: blob}); toast('Arquivo pronto: ' + filename); }
    catch (e) {
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') return toast('Já há um download aguardando confirmação.');
      toast('Não foi possível baixar o arquivo aqui.');
    }
    return;
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
    toast('Arquivo pronto: ' + filename);
  } catch (e) { toast('Não foi possível baixar o arquivo neste navegador.'); }
}

/* ═════════ Avaliações ═════════ */
const avals = a => (a.avaliacoes || []).slice().sort((x, y) => (x.data || '').localeCompare(y.data || ''));
function lastVal(a, k, beforeId) {
  const list = avals(a);
  let end = list.length;
  if (beforeId) { const i = list.findIndex(v => v.id === beforeId); if (i >= 0) end = i; }
  for (let i = end - 1; i >= 0; i--) if (has(list[i][k])) return {v: num(list[i][k]), data: list[i].data};
  return null;
}
function firstVal(a, k) { for (const v of avals(a)) if (has(v[k])) return {v: num(v[k]), data: v.data}; return null; }
const pesoAtual = a => { const l = lastVal(a, 'peso'); return l ? l.v : NaN; };
const pesoInicial = a => { const f = firstVal(a, 'peso'); return f ? f.v : NaN; };
const lastAvalDate = a => { const l = avals(a); return l.length ? l[l.length - 1].data : null; };
function imc(a) { const p = pesoAtual(a), h = num(a.altura) / 100; return p && h ? p / (h * h) : NaN; }
function imcFaixa(v) { if (isNaN(v)) return ''; return v < 18.5 ? 'Abaixo do peso' : v < 25 ? 'Peso adequado' : v < 30 ? 'Sobrepeso' : v < 35 ? 'Obesidade grau I' : v < 40 ? 'Obesidade grau II' : 'Obesidade grau III'; }
function metaProg(a) {
  const ini = pesoInicial(a), at = pesoAtual(a), meta = num(a.pesoMeta);
  if (isNaN(ini) || isNaN(at) || isNaN(meta) || ini === meta) return NaN;
  return clamp((ini - at) / (ini - meta), 0, 1);
}
function tmb(a) {
  const p = pesoAtual(a), h = num(a.altura), i = num(a.idade);
  if (isNaN(p) || isNaN(h) || isNaN(i)) return NaN;
  return 10 * p + 6.25 * h - 5 * i + (a.sexo === 'F' ? -161 : 5);
}
function saude(a) {
  const l = k => { const x = lastVal(a, k); return x ? x.v : NaN; };
  const p = pesoAtual(a), g = l('gordura'), cin = l('cintura'), qua = l('quadril'), h = num(a.altura);
  const mg = !isNaN(p) && !isNaN(g) ? p * g / 100 : NaN;

function addFoto(input) {
  const file = input.files && input.files[0]; const a = cur(); if (!file || !a) return;
  const tipo = input.dataset.foto, ordem = +input.dataset.ordem;
  toast('Preparando foto…');
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight, max = 900, q = 0.72, url = '';
      for (let t = 0; t < 6; t++) {
        const s = Math.min(1, max / Math.max(w, h)); const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); url = c.toDataURL('image/jpeg', q);
        if (url.length < 190000) break; max = Math.round(max * 0.82); q = Math.max(0.5, q - 0.06);
      }
      const f = {id: uid(), alunoId: a.id, tipo, ordem, data: today(), img: url, updatedAt: Date.now()};
      S.fotos[f.id] = f; markFoto(f.id); toast('Foto salva'); render(true);
    };
    img.onerror = () => toast('Não consegui ler esta imagem. Tente outra foto.');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

        const arp = [0, 7, 12, 15, 12, 7, 3, 7]; if (bar >= 4) synth(t, ch + arp[i % 8], d * .8, {wave: 'square', cut: 2400, vol: .045, del: .4, s: .2}); if (i === 0) synth(t, ch, d * 15, {det: [-12, 0, 12], cut: 1100, vol: .035, a: .4, s: .8, rel: .6, wet: .5}); }},
      {n: 'Órbita Lenta', bpm: 104, spb: 16, f(s, t, d) { const bar = s / 16, i = s % 16, ch = prog([50, 46, 53, 48], bar); if (i === 0 || i === 10) kick(t); if (i % 4 === 2) noise(t, 8000, .04, .12); if (i === 8) noise(t, 1500, .2, .3, 'bandpass');
        if (i % 4 === 0) synth(t, ch - 24, d * 3, {cut: 380, vol: .18, s: .5}); const mel = [12, 0, 15, 0, 19, 17, 15, 0, 14, 0, 12, 0, 10, 12, 0, 7]; if (bar >= 2 && mel[i]) synth(t, ch + mel[i], d * 1.4, {wave: 'triangle', cut: 3000, vol: .06, del: .5, wet: .3, s: .4});

      {n: 'Aurora Drive', bpm: 122, spb: 16, f(s, t, d) { const bar = s / 16, i = s % 16, ch = prog([52, 52, 48, 50], bar); if (i % 4 === 0) kick(t); if (i % 2 === 1) noise(t, 9000, .03, .1); if (i === 4 || i === 12) noise(t, 2000, .14, .3, 'bandpass');

    ],

      {n: 'Noturno em Lá menor', bpm: 60, spb: 12, f(s, t, d) { const bar = s / 12, i = s % 12, chs = [[45, 52, 57, 60, 64], [41, 48, 53, 57, 60], [38, 45, 50, 53, 57], [40, 47, 52, 56, 59]], c = prog(chs, bar); const ar = [0, 1, 2, 3, 4, 3, 2, 1, 2, 3, 4, 3]; piano(t, c[ar[i]], d * 3, i === 0 ? .8 : .42);

      {n: 'Valsa das Constelações', bpm: 138, spb: 3, f(s, t, d) { const bar = Math.floor(s / 3), i = s % 3, chs = [[43, 59, 62, 67], [48, 60, 64, 67], [50, 60, 62, 66], [43, 59, 62, 65], [40, 55, 59, 64], [45, 57, 60, 64], [50, 57, 62, 66], [43, 55, 59, 62]], c = chs[bar % 8];
        if (i === 0) piano(t, c[0], d * 3, .75); else { piano(t, c[1], d, .4); piano(t, c[2], d, .38); piano(t, c[3], d, .36); }

    ]

  function sched() {

    while (nextT < ac.currentTime + .12) { try { tr.f(step, nextT, sd); } catch (e) {} step++; nextT += sd; if (step % tr.spb === 0 && ++barCount >= 48) { barCount = 0; idx = (idx + 1) % TR[list].length; step = 0; show(); return; } }
  }
  function show() { const el = $('#mTrack'); el.hidden = !playing; el.textContent = (list === 'piano' ? '🎹 ' : '⚡ ') + TR[list][idx].n; $('#mPlay').classList.toggle('on', playing); $('#mPlay').textContent = playing ? '❚❚' : '♪'; $('#mList').textContent = list === 'piano' ? '🎹' : '⚡'; $('#mPlay').setAttribute('aria-label', playing ? 'Pausar música' : 'Tocar música'); }
  function play() { init(); if (ac.state === 'suspended') ac.resume(); master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(.55, ac.currentTime); nextT = ac.currentTime + .05; playing = true; clearInterval(timer); timer = setInterval(sched, 25); show(); }

    toggle() { playing ? stop() : play(); },
    next() { idx = (idx + 1) % TR[list].length; step = 0; barCount = 0; if (!playing) play(); else show(); },
    switchList() { list = list === 'piano' ? 'eletronica' : 'piano'; prefs.playlist = list; savePrefs(); idx = 0; step = 0; barCount = 0; if (!playing) play(); else show(); toast(list === 'piano' ? 'Playlist: piano clássico' : 'Playlist: eletrônica'); },

(() => { // Botões de música somem ao rolar para baixo ou ao digitar
  const m = $('#music'); let lastY = scrollY, typing = false;
  addEventListener('scroll', () => { const y = scrollY; if (!typing) m.classList.toggle('hide', y > lastY + 4 && y > 80); if (y < lastY - 4) m.classList.remove('hide'); lastY = y; }, {passive: true});

  document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!a || !a.matches('input,textarea,select')) { typing = false; m.classList.remove('hide'); } }, 60));
